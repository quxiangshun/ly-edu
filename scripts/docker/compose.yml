# 完整编排：MySQL + Redis + Python API + admin + pc
# 使用: 在本目录 (scripts/docker) 下执行: docker compose up -d
# 需在仓库根目录构建：docker build -f lyedu-api-python/Dockerfile .
# 本目录下的 .env 会被自动加载（DOCKER_REGISTRY、NPM_REGISTRY）
services:
  mysql:
    image: ${DOCKER_REGISTRY:-}mysql:8.0
    container_name: lyedu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: lyedu123456
      MYSQL_DATABASE: lyedu
      MYSQL_USER: lyedu
      MYSQL_PASSWORD: lyedu123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - lyedu-network
    restart: unless-stopped

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: lyedu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lyedu-network
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: lyedu-api-python/Dockerfile
    container_name: lyedu-api
    ports:
      - "9700:9700"
    environment:
      - ENV=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=lyedu
      - MYSQL_PASSWORD=lyedu123456
      - MYSQL_DATABASE=lyedu
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_PATH=/workspace/lyedu-api-python/uploads
    volumes:
      - ../../uploads:/workspace/lyedu-api-python/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - lyedu-network
    restart: unless-stopped

  admin:
    build:
      context: ../../lyedu-admin
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: lyedu-admin
    ports:
      - "9900:80"
    depends_on:
      - api
    networks:
      - lyedu-network
    restart: unless-stopped

  pc:
    build:
      context: ../../lyedu-pc
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: lyedu-pc
    ports:
      - "9800:80"
    depends_on:
      - api
    networks:
      - lyedu-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  lyedu-network:
    driver: bridge

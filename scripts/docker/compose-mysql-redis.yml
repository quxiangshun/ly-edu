# 仅启动 MySQL + Redis，开发环境直连 localhost
# 使用: 在本目录 (scripts/docker) 下执行: docker compose -f compose-mysql-redis.yml up -d
# 然后本地启动: Python API(9700) / lyedu-admin(9900) / lyedu-pc(9800) / lyedu-unix 等
#
# 客户端工具连接 MySQL（本机）：
#   主机: 127.0.0.1 或 localhost
#   端口: 3306
#   用户: root  或  lyedu
#   密码: Lyedu@123
#   数据库: lyedu
#
# Redis 连接（本机，Redis 7 默认用户名必填）：
#   主机: 127.0.0.1 或 localhost
#   端口: 6379
#   用户名: default
#   密码: Lyedu@123
services:
  mysql:
    image: ${DOCKER_REGISTRY:-}mysql:8.0
    container_name: lyedu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Lyedu@123
      MYSQL_DATABASE: lyedu
      MYSQL_USER: lyedu
      MYSQL_PASSWORD: Lyedu@123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - lyedu-network
    restart: unless-stopped

  redis:
    image: ${DOCKER_REGISTRY:-}redis:8.2.5
    container_name: lyedu-redis
    # 关键修改：使用 ACL 设置默认用户密码；bind 0.0.0.0 以便宿主机可连接
    command: >
      redis-server
      --bind 0.0.0.0
      --aclfile /etc/redis/users.acl
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      # 挂载 ACL 配置文件
      - ./redis-acl.conf:/etc/redis/users.acl
    networks:
      - lyedu-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  lyedu-network:
    driver: bridge
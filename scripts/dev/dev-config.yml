# LyEdu 开发环境配置（scripts/dev/start.ps1 读取）
# 复制为 dev-config.yml 后按需修改；若存在 dev-config.yml 则优先于 dev-config.json。

# ---------------------------------------------------------------------------
# database：MySQL 连接信息
# ---------------------------------------------------------------------------
# 用途：
#   1) start_docker_mysql_redis 为 true 时，用 database.port 检查本机是否已有 MySQL 在监听；
#      若未监听则执行 docker compose 启动 MySQL+Redis（Docker 内账号密码由 compose 文件决定）。
#   2) start_lyedu_api_python 为 true 时，将下列字段写入环境变量 MYSQL_*，
#      并注入到 lyedu-api-python 的启动进程，API 通过 config.py 读取这些环境变量连接数据库。
# 字段对应：host -> MYSQL_HOST, port -> MYSQL_PORT, user -> MYSQL_USERNAME,
#          password -> MYSQL_PASSWORD, database -> MYSQL_DATABASE
# ---------------------------------------------------------------------------
database:
  host: "127.0.0.1"
  port: 3306
  user: lyedu
  password: Lyedu@123
  database: lyedu

# ---------------------------------------------------------------------------
# redis：Redis 连接信息
# ---------------------------------------------------------------------------
# 用途：仅当 start_lyedu_api_python 为 true 时使用。
# 会写入环境变量 REDIS_HOST、REDIS_PORT，由 lyedu-api-python 的 config.py 读取。
# ---------------------------------------------------------------------------
redis:
  host: "127.0.0.1"
  port: 6379

# 为 true 时：若 database.port 未在监听则自动执行 docker compose 启动 MySQL+Redis
start_docker_mysql_redis: false

# 是否启动各服务（true/false）
start_lyedu_api_python: true
start_lyedu_admin: true
start_lyedu_pc: true
